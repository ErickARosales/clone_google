<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Establece el set de caracteres a UTF-8 -->
    <meta charset="UTF-8">
    <!-- Configuración inicial para la responsividad -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Titulo de la pagina -->
    <title>Google Clone</title>
    <!-- Iconos de google -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Importar la hoja de estilos -->
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <header>
        <a href="#" class="nav-link">Gmail</a>
        <a href="#" class="nav-link">Imágenes</a>
        <span class="material-icons app-icon" title="Aplicaciones de Google">apps</span>
        <button class="sign-in-btn">Acceder</button>
    </header>

    <main>
        <div class="logo">
            <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png">
        </div>
        <div class="search-container">
            <span class="material-icons search-icon">search</span>
            <input type="text" class="search-input" autofocus>
            <div class="search-tools">
                <span class="material-icons" title="Buscar por voz">mic</span>
                <span class="material-icons" title="Buscar por imagen">photo_camera</span>
            </div>
        </div>
        <div class="buttons-container">
            <button class="google-btn">Buscar con Google</button>
            <button class="google-btn">Voy a tener suerte</button>
        </div>
    </main>

    <footer>
        <div class="footer-row">
            <span>México</span>
        </div>
        <div class="footer-row bottom">
            <div class="footer-links">
                <a href="#">Sobre Google</a>
                <a href="#">Publicidad</a>
                <a href="#">Negocios</a>
                <a href="#">Cómo funciona la Búsqueda</a>
            </div>
            <div class="footer-links">
                <a href="#">Privacidad</a>
                <a href="#">Condiciones</a>
                <a href="#">Preferencias</a>
            </div>
        </div>
    </footer>

    <!-- Tu código HTML va aquí -->
    <!-- Importar el script -->
    <script src="script.js"></script>
</body>
</html>
